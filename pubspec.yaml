name: watchlistgo
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.4
  firebase_core: 5.2.0
  cloud_firestore: 7.2.0
  firebase_auth: 7.1.0
  firebase_analytics: 13.1.0
  google_sign_in: ^7.1.1
  connectivity_plus: ^7.0.0
  firebase_messaging: 17.1.0
  flutter_local_notifications: ^20.1.0
  flutter_dotenv: ^6.0.0
  flutter_cache_manager: ^3.4.1
  custom_pop_up_menu: ^1.2.4
  flutter_svg: ^2.2.4
  palette_generator: ^0.3.3+7

  material_ui: any
  mcp_toolkit: ^8.0.0
  shared_preferences_android: ^2.5.5
  firebase_app_check: ^0.5.2
  cloud_functions: ^7.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.webp
    - assets/arrow_left.svg
    - .env

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_icon.webp"
  min_sdk_android: 21