name: watchlistgo
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.4
  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3
  firebase_auth: ^6.2.0
  firebase_analytics: ^12.1.3
  google_sign_in: ^7.1.1
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.webp
    - assets/app_icon.webp

flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_icon.webp"
  min_sdk_android: 21